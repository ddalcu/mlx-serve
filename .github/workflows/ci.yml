name: CI

# Build + test on every PR and main push. Mirrors the build/test portion of
# release.yml (same macos-26 runner, same steps, same mlx cache key — the two
# workflows share the self-built mlx stage) without signing/notarize/packaging.
#
# This is also the macOS 26.2 compatibility gate: dev machines may run newer
# macOS betas, but the shipped binaries must keep building and testing against
# the 26.x SDK the runner provides (build.zig targets os_version_min 26.2).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Zig graph and the Swift app share nothing on disk (app/ never reads
  # zig-out), so they run as two jobs on two runners instead of one after the
  # other (#639). The Zig build and `zig build test` share no output either, so
  # they are two jobs too.
  zig:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Zig + mlx stage
        id: stage
        uses: ./.github/actions/zig-stage

      # Bounded: the key is written once per toolchain/build/submodule set, so
      # later runs restore it and never re-save a growing cache. Xcode is in the
      # key because zig caches configure-time SDK paths. One key per job, or the
      # two jobs race to save one.
      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-cache-build-${{ hashFiles('scripts/fetch-zig.sh', 'build.zig', 'build.zig.zon') }}-${{ steps.stage.outputs.submodules }}-${{ steps.stage.outputs.xcode }}

      - name: Build mlx-serve (Zig, ReleaseFast)
        run: zig build -Doptimize=ReleaseFast -Dstrip

      - name: Build vz-agent guest binary
        run: zig build vz-agent

      - name: Smoke test mlx-serve binary
        run: |
          ./zig-out/bin/mlx-serve --version
          ./zig-out/bin/mlx-serve --help > /dev/null

      # Static guard: staged metallib contains the *_nax kernels, minos >= 26.2,
      # and the built binary links no leftover brew mlx/mlx-c.
      - name: Verify staged mlx (NAX kernels + minos)
        run: bash tests/test_mlx_staged_nax.sh

      # The kit builds its example from itself, `plugin new|check|fixture|install` work, and the binary above serves a
      # kit-built dylib's pack (CPU-light: the fixture pack is 2 layers at width 16).
      - name: Plugin kit end to end
        run: bash tests/test_plugin_kit.sh

  zig-test:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # Needed to diff against origin/${{ github.base_ref }} below.
          fetch-depth: 0

      - name: Zig + mlx stage
        id: stage
        uses: ./.github/actions/zig-stage

      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-cache-test-${{ hashFiles('scripts/fetch-zig.sh', 'build.zig', 'build.zig.zon') }}-${{ steps.stage.outputs.submodules }}-${{ steps.stage.outputs.xcode }}

      # PRs skip the slow corpus replay and benchmarks unless the diff touches
      # the tool-calling parse chain or its fixture, since that replay is the
      # only guard for the "hard invariants (replay-pinned)" in CLAUDE.md.
      # Pushes to main always run them.
      - name: Check whether this diff needs the slow tool-traffic replay
        id: slowtests
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "needed=1" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}..." \
              | grep -qE '^src/host/chat/|^src/fixtures/tool_traffic\.jsonl$'; then
            echo "needed=1" >> "$GITHUB_OUTPUT"
          else
            echo "needed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Zig tests
        # 4 shards: the default sizes them by RAM. Not every GPU test skips on this virtual GPU, and at 8 they ran it
        # out of memory (a different kernel test exited 255 on each run).
        run: zig build test --summary all -Dtest-shards=4 ${{ steps.slowtests.outputs.needed == '1' && '-Dslow-tests' || '' }}

      # The flip proof: a PR that flips a lever's default lists the tests that hold only at the new default
      # (scripts/flip_proof.py). GPU tests skip on this runner; the box job runs them for the lever being flipped.
      - name: Flip proof (CPU, the levers this PR flips)
        if: github.event_name == 'pull_request'
        run: python3 scripts/flip_proof.py ci "origin/${{ github.base_ref }}" -Dtest-shards=4 -Dtest-filter=deepseek -Dtest-filter=dsv4

  swift-app:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (Swift 6.1+ required by MCP swift-sdk)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Compute Xcode cache key
        id: xcode
        run: echo "xcode=$(xcodebuild -version | tr ' \n' '--')" >> "$GITHUB_OUTPUT"

      # Dependencies (NIO, MCP, SwiftTerm, SwaTex) are most of a cold Swift
      # build and only change with Package.resolved. Our own sources get fresh
      # mtimes from checkout, so MLXCore always recompiles.
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: app/.build
          key: swiftpm-ci-${{ hashFiles('app/Package.resolved', 'scripts/patch-swatex-font-lookup.sh') }}-${{ steps.xcode.outputs.xcode }}

      # Do not force one Swift language mode through the dependency graph.
      # Each package's manifest owns its mode (SwaTex requires Swift 6.1).
      # Debug build only; the release build is release.yml's.
      - name: Build and test Swift app
        working-directory: app
        run: |
          # Catch a drifted SwaTex font-lookup patch here rather than at release
          # time (issue #233). Mirrors app/build.sh.
          swift package resolve
          bash ../scripts/patch-swatex-font-lookup.sh .build/checkouts/SwaTex
          swift build --build-tests
          bash test.sh
