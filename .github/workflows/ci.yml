name: CI

# Build + test on every PR and main push. Mirrors the build/test portion of
# release.yml (same macos-26 runner, same steps, same mlx cache key — the two
# workflows share the self-built mlx stage) without signing/notarize/packaging.
#
# This is also the macOS 26.2 compatibility gate: dev machines may run newer
# macOS betas, but the shipped binaries must keep building and testing against
# the 26.x SDK the runner provides (build.zig targets os_version_min 26.2).
#
# A PR runs only the jobs its files reach (`changes`, scripts/ci-changes.sh; a
# skipped job counts as passing; if `changes` itself fails every job runs).
# push to main and workflow_dispatch run all of
# them. The Zig and SwiftPM caches are saved from main only: a PR restores them
# and never writes its own 250-550 MB copy, which no other PR can read and which
# pushed the repo over the 10 GB cap (evicting the Linux and Windows MLX stages).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      zig: ${{ steps.scope.outputs.zig }}
      swift: ${{ steps.scope.outputs.swift }}
      slow: ${{ steps.scope.outputs.slow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # The PR's own files: a pull_request checkout is the merge commit, whose first
      # parent is the base it was merged onto. Anything else runs everything.
      - name: Which jobs does this change need
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ] || ! git rev-parse --verify -q HEAD^2 > /dev/null; then
            printf 'zig=true\nswift=true\nslow=true\n' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD | tee /dev/stderr | bash scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

      - name: Scope rules still cover what the Swift tests read
        run: bash tests/test_ci_changes.sh

  # Needed by no job: a red `changes` would run every job, slow tests included.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Release, build-mode and cache gates
        run: |
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          bash tests/test_release_workflow_gates.sh

  # The Zig graph and the Swift app share nothing on disk (app/ never reads
  # zig-out), so they run as two jobs on two runners instead of one after the
  # other (#639). The Zig build and `zig build test` share no output either, so
  # they are two jobs too.
  zig:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.zig == 'true') }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Zig + mlx stage
        id: stage
        uses: ./.github/actions/zig-stage

      # Bounded: one entry per job per ISO week and toolchain/build/submodule set,
      # saved by main's first good build of the week, no restore-keys fallback: a
      # zig cache only grows, so the week is the restart. Xcode is in the key
      # because zig caches configure-time SDK paths. One key per job, or the two
      # jobs race to save one.
      - name: Zig cache key
        id: zigkey
        run: echo "key=zig-cache-build-${{ hashFiles('scripts/fetch-zig.sh', 'build.zig', 'build.zig.zon') }}-${{ steps.stage.outputs.submodules }}-${{ steps.stage.outputs.xcode }}-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore Zig build artifacts
        id: zigcache
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: ${{ steps.zigkey.outputs.key }}

      # A PR's binary only runs the checks below, so it builds Debug; push and dispatch keep the shipped mode.
      - name: Build mlx-serve (Zig)
        id: build
        env:
          OPTIMIZE: ${{ github.event_name == 'pull_request' && 'Debug' || 'ReleaseFast' }}
        run: zig build -Doptimize="$OPTIMIZE" -Dstrip

      - name: Build vz-agent guest binary
        run: zig build vz-agent

      - name: Smoke test mlx-serve binary
        run: |
          ./zig-out/bin/mlx-serve --version
          ./zig-out/bin/mlx-serve --help > /dev/null

      # Static guard: staged metallib contains the *_nax kernels, minos >= 26.2,
      # and the built binary links no leftover brew mlx/mlx-c.
      - name: Verify staged mlx (NAX kernels + minos)
        run: bash tests/test_mlx_staged_nax.sh

      # The kit builds its example from itself, `plugin new|check|fixture|install` work, and the binary above serves a
      # kit-built dylib's pack (CPU-light: the fixture pack is 2 layers at width 16).
      - name: Plugin kit end to end
        run: bash tests/test_plugin_kit.sh

      - name: Save Zig build artifacts
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.ref == 'refs/heads/main' && steps.zigcache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: ${{ steps.zigkey.outputs.key }}

  zig-test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.zig == 'true') }}
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        slice: [core-media, llm-contracts]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Zig + mlx stage
        id: stage
        uses: ./.github/actions/zig-stage

      - name: Zig cache key
        id: zigkey
        run: echo "key=zig-cache-test-${{ matrix.slice }}-${{ hashFiles('scripts/fetch-zig.sh', 'build.zig', 'build.zig.zon') }}-${{ steps.stage.outputs.submodules }}-${{ steps.stage.outputs.xcode }}-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore Zig build artifacts
        id: zigcache
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: ${{ steps.zigkey.outputs.key }}

      # PRs skip the slow corpus replay and benchmarks unless the diff touches
      # the tool-calling parse chain or its fixture (`changes`), since that replay
      # is the only guard for the "hard invariants (replay-pinned)" in CLAUDE.md.
      # Pushes to main always run them.
      - name: Run Zig tests
        # Two balanced slices (`core-media` and `llm-contracts`) keep peak concurrent macOS jobs at 4 (avoiding
        # runner-pool queueing) while separating the two heavy virtual-GPU suites (`llm` and `media`).
        # -Dstrip on a PR keeps the test compile's memory down; a panic there prints no stack, so rerun it without.
        run: zig build test-${{ matrix.slice }} --summary all -Dtest-shards=4 ${{ (needs.changes.result != 'success' || needs.changes.outputs.slow == 'true') && '-Dslow-tests' || '' }} ${{ github.event_name == 'pull_request' && '-Dstrip' || '' }}

      - name: Save Zig build artifacts
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.zigcache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: ${{ steps.zigkey.outputs.key }}

  swift-app:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.swift == 'true') }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (Swift 6.1+ required by MCP swift-sdk)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Compute Xcode cache key
        id: xcode
        run: echo "xcode=$(xcodebuild -version | tr ' \n' '--')" >> "$GITHUB_OUTPUT"

      # Dependencies (NIO, MCP, SwiftTerm, SwaTex) are most of a cold Swift
      # build and only change with Package.resolved. Our own sources get fresh
      # mtimes from checkout, so MLXCore always recompiles.
      - name: SwiftPM cache key
        id: swiftkey
        run: echo "key=swiftpm-ci-${{ hashFiles('app/Package.resolved', 'scripts/patch-swatex-font-lookup.sh') }}-${{ steps.xcode.outputs.xcode }}" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM build
        id: swiftpm
        uses: actions/cache/restore@v4
        with:
          path: app/.build
          key: ${{ steps.swiftkey.outputs.key }}

      # Do not force one Swift language mode through the dependency graph.
      # Each package's manifest owns its mode (SwaTex requires Swift 6.1).
      # Debug build only; the release build is release.yml's.
      - name: Build Swift app and tests
        id: compile
        working-directory: app
        run: |
          # Catch a drifted SwaTex font-lookup patch here rather than at release
          # time (issue #233). Mirrors app/build.sh.
          swift package resolve
          bash ../scripts/patch-swatex-font-lookup.sh .build/checkouts/SwaTex
          swift build --build-tests

      - name: Test Swift app
        working-directory: app
        run: bash test.sh --skip-build

      - name: Save SwiftPM build
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && github.ref == 'refs/heads/main' && steps.swiftpm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: app/.build
          key: ${{ steps.swiftkey.outputs.key }}

