name: Linux

# Linux/CUDA build of the mlx-serve server for RTX 20-50 series (Turing sm_75,
# Ampere/Ada sm_86, Blackwell sm_120 + PTX), via scripts/build-linux.sh — the
# same one-shot script a developer runs. GitHub's runners have no GPU, so this
# is a compile-and-link gate plus a downloadable build, not a runtime test.
#
# Every slow input is cached by what produced it: the stage scripts stamp their
# outputs with the same inputs the cache keys hash, so a hit skips the stage
# (checkout gives sources fresh mtimes, so object-file caches would rebuild
# anyway). A warm run compiles only mlx-serve itself: one LLVM module, so Zig's
# cache cannot carry it across commits, and restored libraries are new files to it.
#
# The tarball keeps the repo layout the binary's $ORIGIN rpaths expect
# (zig-out/bin/mlx-serve next to lib/mlx/lib and lib/llama/lib). Running it
# needs an NVIDIA driver >= 580 (CUDA 13), the CUDA 13 toolkit (MLX JIT-compiles
# kernels against its headers) and cuDNN 9, plus OpenBLAS/LAPACKE, libwebp and
# the Avahi dns_sd compat library.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_ARCH: "75;86;120"
  # Portable CPU code: the runner's own CPU features must not leak into the build.
  ZIG_CPU: x86_64_v3
  NATIVE_CPU_FLAG: -march=x86-64-v3
  APT_PACKAGES: cuda-toolkit-13 cudnn9-cuda-13 cmake liblapacke-dev libopenblas-dev libwebp-dev libavahi-compat-libdnssd-dev

jobs:
  cuda:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # The submodules' git data, keyed by their pinned commits (the gitlinks).
      - name: Compute pins
        id: pins
        run: |
          pin() { git ls-tree HEAD "$1" | awk '{print substr($3,1,12)}'; }
          echo "submodules=$(git ls-tree HEAD lib | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "mlx=$(pin lib/mlx-src)-$(pin lib/mlxc-src)" >> "$GITHUB_OUTPUT"
          echo "ds4=$(pin lib/ds4)" >> "$GITHUB_OUTPUT"
          echo "arch=$(echo "$CUDA_ARCH" | tr ';' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache submodules
        uses: actions/cache@v4
        with:
          path: .git/modules
          key: submodules-${{ steps.pins.outputs.submodules }}
          restore-keys: submodules-

      - name: Check out submodules
        run: git submodule update --init --depth 1 --jobs 8

      - name: Cache MLX stage
        uses: actions/cache@v4
        with:
          path: lib/mlx
          key: mlx-linux-cuda-${{ steps.pins.outputs.mlx }}-${{ steps.pins.outputs.arch }}-${{ hashFiles('patches/mlx*.patch', 'scripts/build-mlx-linux.sh') }}

      - name: Cache ds4 stage
        uses: actions/cache@v4
        with:
          path: lib/ds4-linux
          key: ds4-linux-cuda-${{ steps.pins.outputs.ds4 }}-${{ steps.pins.outputs.arch }}-${{ env.NATIVE_CPU_FLAG }}-${{ hashFiles('scripts/build-ds4-linux.sh') }}

      - name: Cache llama.cpp stage
        uses: actions/cache@v4
        with:
          path: lib/llama
          key: llama-linux-cuda-${{ hashFiles('scripts/fetch-llama.sh') }}

      - name: Cache Zig toolchain
        uses: actions/cache@v4
        with:
          path: .zig-toolchain
          key: zig-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-zig.sh') }}

      # CUDA (+ its cached .debs) and the build do not fit the runner's default free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # The .debs (~4 GB of CUDA + cuDNN) are cached; installing them still runs every time.
      - name: Cache CUDA packages
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-ubuntu2404-${{ hashFiles('.github/workflows/linux.yml') }}
          restore-keys: apt-ubuntu2404-

      - name: Install CUDA 13, cuDNN and build dependencies
        run: |
          curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          mkdir -p ~/apt-archives/partial
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::archives="$HOME/apt-archives" \
            -o APT::Keep-Downloaded-Packages=true $APT_PACKAGES
          sudo chown -R "$USER" ~/apt-archives
          echo /usr/local/cuda/bin >> "$GITHUB_PATH"

      - name: Build
        run: ./scripts/build-linux.sh

      - name: Check every library resolves (libcuda.so.1 comes with the driver)
        run: |
          ! ldd zig-out/bin/mlx-serve | grep 'not found' | grep -v 'libcuda.so.1'

      - name: Package
        run: |
          tar czf mlx-serve-linux-x64-cuda13.tar.gz zig-out/bin/mlx-serve lib/mlx/lib lib/llama/lib LICENSE LICENSE-APACHE-2.0 NOTICE

      - uses: actions/upload-artifact@v4
        with:
          name: mlx-serve-linux-x64-cuda13
          path: mlx-serve-linux-x64-cuda13.tar.gz
