name: Windows

# Windows/CUDA build of the mlx-serve server, via scripts/build-windows.ps1 — the
# same one-shot script a developer runs: RTX 20-50 series (sm_75, sm_86, sm_120).
# GitHub's runners have no GPU, so this is a compile-and-link gate, a start-up
# check (every DLL resolves; MLX loads CUDA only on first use) and a downloadable
# build, not a runtime test.
#
# Every slow input is cached by what produced it, as in linux.yml: the stage
# scripts stamp their outputs with the inputs the cache keys hash, so a hit skips
# the stage, and CUDA is only installed when the MLX stage has to be rebuilt.
#
# A PR runs only when its files reach the Zig graph (`changes`, scripts/ci-changes.sh; a
# skipped job counts as passing) and builds the fast variant: `-Dstrip`, no zip. push to
# main and workflow_dispatch build what release.yml attaches to a release. Only main saves
# the cheap caches: a PR's copy is unreadable to every other PR and pushed the repo over
# the 10 GB cap.
#
# Running the zip needs an NVIDIA driver >= 580, the CUDA 13 toolkit (CUDA_PATH)
# and cuDNN 9 for CUDA 13 (CUDNN_PATH): both engines load those, none ship in it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      zig: ${{ steps.scope.outputs.zig }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # The PR's own files: a pull_request checkout is the merge commit, whose first
      # parent is the base it was merged onto. Anything else runs everything.
      - name: Which jobs does this change need
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ] || ! git rev-parse --verify -q HEAD^2 > /dev/null; then
            echo "zig=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD | tee /dev/stderr | bash scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  cuda:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.zig == 'true') }}
    name: cuda (x64)
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      MLX_CUDA_ARCHITECTURES: "75;86;120"
      ZIG_CPU: x86_64_v3
      ZIG_BUILD_ARGS: ${{ github.event_name == 'pull_request' && '-Dstrip=true' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify kernel checkout bytes
        run: python tests/test_kernel_checkout.py

      - name: Compute pins
        id: pins
        shell: bash
        run: |
          pin() { git ls-tree HEAD "$1" | awk '{print substr($3,1,12)}'; }
          echo "submodules=$(git ls-tree HEAD lib | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "mlx=$(pin lib/mlx-src)-$(pin lib/mlxc-src)" >> "$GITHUB_OUTPUT"
          echo "arch=$(echo "$MLX_CUDA_ARCHITECTURES" | tr ';' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore submodules cache
        id: submodules
        uses: actions/cache/restore@v4
        with:
          path: .git/modules
          key: submodules-windows-${{ steps.pins.outputs.submodules }}
          restore-keys: submodules-windows-

      - name: Check out submodules
        run: git submodule update --init --depth 1 --jobs 8

      # Restored and saved as two steps, so a later failure still keeps the hour-long MLX build; a PR that
      # changes its inputs saves its own copy too.
      - name: Restore MLX stage
        id: mlx
        uses: actions/cache/restore@v4
        with:
          path: lib/mlx-win
          key: mlx-windows-${{ steps.pins.outputs.mlx }}-${{ steps.pins.outputs.arch }}-${{ hashFiles('patches/mlx*.patch', 'scripts/build-mlx-windows.ps1') }}

      - name: Restore llama.cpp stage
        id: llama
        uses: actions/cache/restore@v4
        with:
          path: lib/llama-win
          key: llama-windows-${{ hashFiles('scripts/fetch-llama.sh') }}

      - name: Restore Zig toolchain
        id: zig
        uses: actions/cache/restore@v4
        with:
          path: .zig-toolchain
          key: zig-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-zig.sh') }}

      # Building MLX needs CUDA 13.0 (13.3's nvcc cannot compile its CUTLASS kernels with MSVC).
      # Not cached: only an MLX stage rebuild needs it.
      - name: Install CUDA 13.0, cuDNN and Ninja
        if: steps.mlx.outputs.cache-hit != 'true'
        run: |
          choco install ninja -y --no-progress
          powershell -File scripts\install-cuda-windows.ps1 -Cuda 13.0.3 -Cudnn 9.27.0 -Dest C:\cuda
          "CUDA_PATH=C:\cuda" >> $env:GITHUB_ENV
          "CUDNN_PATH=C:\cuda\cudnn" >> $env:GITHUB_ENV

      # A PR's build is never attached to a release, so it skips the zip.
      - name: Build
        run: powershell -File scripts\build-windows.ps1 ${{ github.event_name == 'pull_request' && '-NoZip' || '' }}

      - name: Save MLX stage
        if: always() && steps.mlx.outputs.cache-hit != 'true' && hashFiles('lib/mlx-win/.version') != ''
        uses: actions/cache/save@v4
        with:
          path: lib/mlx-win
          key: ${{ steps.mlx.outputs.cache-primary-key }}

      - name: Check the exe starts (every DLL resolves)
        run: dist\mlx-serve-windows-x64\mlx-serve.exe --version

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: mlx-serve-windows-x64-cuda13
          path: dist/mlx-serve-windows-x64.zip

      - name: Save submodules cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.submodules.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .git/modules
          key: submodules-windows-${{ steps.pins.outputs.submodules }}

      - name: Save llama.cpp stage
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.llama.outputs.cache-hit != 'true' && hashFiles('lib/llama-win/.version') != '' }}
        uses: actions/cache/save@v4
        with:
          path: lib/llama-win
          key: llama-windows-${{ hashFiles('scripts/fetch-llama.sh') }}

      - name: Save Zig toolchain
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.zig.outputs.cache-hit != 'true' && hashFiles('.zig-toolchain/.version') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .zig-toolchain
          key: zig-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-zig.sh') }}
