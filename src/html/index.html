<noscript><h2>API reference</h2><p>Based on the mlx-serve console by David Dalcu and contributors.</p>
<table><thead><tr><th>Method</th><th>Path</th><th>Description</th></tr></thead><tbody><tr><td>GET</td><td>/</td><td>MLX Serve Studio web console</td></tr>
<tr><td>POST</td><td>/v1/chat/completions</td><td>Streaming and non-streaming · tool calling · JSON mode · vision (when supported)</td></tr>
<tr><td>POST</td><td>/v1/completions</td><td>Legacy text completions</td></tr>
<tr><td>POST</td><td>/v1/responses</td><td>Stateful responses with tool calling · stream/non-stream · vision</td></tr>
<tr><td>POST</td><td>/v1/responses/compact</td><td>Compact a conversation into a round-trippable opaque blob</td></tr>
<tr><td>GET</td><td>/v1/responses/{{id}}</td><td>Retrieve a stored response envelope</td></tr>
<tr><td>DELETE</td><td>/v1/responses/{{id}}</td><td>Delete a stored response</td></tr>
<tr><td>WS</td><td>/v1/responses</td><td>WebSocket transport · per-connection store-false cache · sequential turns</td></tr>
<tr><td>POST</td><td>/v1/messages</td><td>Claude SDK / Claude Code compatible · stream &amp; non-stream · tool use · thinking blocks</td></tr>
<tr><td>POST</td><td>/api/chat</td><td>Ollama chat · NDJSON stream (default on) · tool calls · images · think</td></tr>
<tr><td>POST</td><td>/api/generate</td><td>Ollama completion · templated or raw</td></tr>
<tr><td>GET</td><td>/api/tags</td><td>List local models (ollama list)</td></tr>
<tr><td>POST</td><td>/api/show</td><td>Model details, template and parameters</td></tr>
<tr><td>GET</td><td>/api/ps</td><td>Models currently resident in memory</td></tr>
<tr><td>POST</td><td>/api/pull</td><td>Download a model from Hugging Face · NDJSON progress</td></tr>
<tr><td>GET</td><td>/api/version</td><td>Version string (clients probe this to detect an Ollama server)</td></tr>
<tr><td>POST</td><td>/api/embed</td><td>Embeddings, current shape (input string or array)</td></tr>
<tr><td>POST</td><td>/api/embeddings</td><td>Embeddings, legacy shape (prompt)</td></tr>
<tr><td>POST</td><td>/v1/embeddings</td><td>Vector embeddings (encoder-only models)</td></tr>
<tr><td>POST</td><td>/v1/decisions</td><td>Laya, Kev and Clef typed decisions · choice / score / noul questions over a JSON state</td></tr>
<tr><td>POST</td><td>/v1/systemone</td><td>Alias for /v1/decisions</td></tr>
<tr><td>POST</td><td>/tokenize</td><td>Tokenize a string</td></tr>
<tr><td>POST</td><td>/detokenize</td><td>Detokenize an id sequence</td></tr>
<tr><td>POST</td><td>/v1/images/generations</td><td>FLUX.2, Krea &amp; Mage-Flow text-to-image · img2img + instruction edit · runtime LoRA · base64 PNG</td></tr>
<tr><td>POST</td><td>/v1/images/edits</td><td>OpenAI-compatible image editing · multipart form · one or more reference images + an instruction</td></tr>
<tr><td>POST</td><td>/v1/audio/speech</td><td>Qwen3-TTS (zero-shot voice cloning) or Kokoro (54 blendable voices) · WAV</td></tr>
<tr><td>POST</td><td>/v1/audio/music-generations</td><td>ACE-Step text-to-music · 48 kHz stereo WAV</td></tr>
<tr><td>POST</td><td>/v1/audio/sound-generations</td><td>Stable Audio 3 text-to-audio · sound effects · 44.1 kHz stereo WAV</td></tr>
<tr><td>POST</td><td>/v1/video/generations</td><td>LTX-Video or MiniMax-H3 · text / image / audio → video with its own soundtrack · frames + PCM</td></tr>
<tr><td>POST</td><td>/v1/3d/generations</td><td>Hunyuan3D-2.1 · one photo → GLB mesh · optional PBR texturing</td></tr>
<tr><td>POST</td><td>/v1/load-model</td><td>Load a discovered model, or register + load one by absolute path</td></tr>
<tr><td>POST</td><td>/v1/unload-model</td><td>Free a model&#39;s memory now</td></tr>
<tr><td>POST</td><td>/v1/models/rescan</td><td>Pick up models added to the model folders since startup</td></tr>
<tr><td>GET</td><td>/v1/providers</td><td>Configured upstream chat providers (~/.mlx-serve/providers.json) and whether each answered its last probe</td></tr>
<tr><td>POST</td><td>/v1/providers/reload</td><td>Re-read providers.json and re-probe now</td></tr>
<tr><td>GET</td><td>/v1/models</td><td>OpenAI models list (id, capabilities, context length) — this console&#39;s model picker</td></tr>
<tr><td>GET</td><td>/props</td><td>llama.cpp-style server props (chat template, memory)</td></tr>
<tr><td>GET</td><td>/health</td><td>Liveness probe</td></tr>
<tr><td>GET</td><td>/metrics</td><td>Prometheus metrics, text exposition format (enable with --metrics)</td></tr>
<tr><td>GET</td><td>/metrics.json</td><td>Metrics as JSON — drives the Monitor panel (enable with --metrics)</td></tr></tbody></table>
